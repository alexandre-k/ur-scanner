apiVersion: v2
name: rust-app
description: A Helm chart for deploying a Rust application with OpenTelemetry to Grafana
type: application
version: 0.1.0
appVersion: "1.0.0"

dependencies:
  - name: opentelemetry-collector
    version: "0.108.0" # Check ArtifactHub for the latest version if needed
    repository: "https://open-telemetry.github.io/opentelemetry-helm-charts"
    condition: opentelemetry-collector.enabled
