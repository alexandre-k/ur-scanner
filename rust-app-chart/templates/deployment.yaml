apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
      annotations:
        # Forces a rolling restart automatically when values.yaml estates change
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 5
          envFrom:
            - secretRef:
                name: {{ .Release.Name }}-env-secret
          env:
            # Standard OTel SDK environment variables picked up automatically by Rust opentelemetry-otlp
            - name: OTEL_METRICS_EXPORTER
              value: "otlp"
            - name: OTEL_LOGS_EXPORTER
              value: "otlp"
            - name: ESTATES_CONFIG_PATH
              value: "/app/data/estates.yaml"
          volumeMounts:
            - name: estates-config
              mountPath: /app/data
              readOnly: true
      volumes:
        - name: estates-config
          configMap:
            name: {{ .Release.Name }}-estates
