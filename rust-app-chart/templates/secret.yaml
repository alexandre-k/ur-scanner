apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-env-secret
type: Opaque
stringData:
  {{- range $line := splitList "\n" (.Files.Get ".env") }}
  {{- $trimmed := trim $line }}
  {{- if and $trimmed (not (hasPrefix "#" $trimmed)) (contains "=" $trimmed) }}
  {{- $parts := splitn "=" 2 $trimmed }}
  {{ trim $parts._0 }}: {{ trim $parts._1 | trimAll "\"" | trimAll "'" | quote }}
  {{- end }}
  {{- end }}
