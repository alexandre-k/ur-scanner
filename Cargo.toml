[package]
name = "ur-scanner"
version = "0.1.2"
edition = "2021"

[dependencies]
anyhow = "1.0"
axum = "0.8"
dotenvy = "0.15"
envy = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
opentelemetry = "0.31"
opentelemetry-appender-tracing = { version = "0.31", features = ["experimental_use_tracing_span_context"] }
opentelemetry-otlp = { version = "0.31", default-features = false, features = ["http-proto", "reqwest-blocking-client", "logs", "trace", "metrics"] }
opentelemetry_sdk = { version = "0.31", features = ["logs", "trace", "metrics"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yml = "0.0.12"
regex = "1.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing-opentelemetry = "0.32"

